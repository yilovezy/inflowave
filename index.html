<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Safari 13 (macOS 10.15 Catalina) polyfills -->
    <script>
      if (typeof globalThis === 'undefined') window.globalThis = window;
      if (!Object.hasOwn) Object.hasOwn = function(o,p){return Object.prototype.hasOwnProperty.call(o,p)};
      if (!window.crypto) window.crypto = {};
      if (!window.crypto.randomUUID) window.crypto.randomUUID=function(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)})};
      if (typeof window.structuredClone==='undefined') window.structuredClone=function(o){return JSON.parse(JSON.stringify(o))};
      if (!Array.prototype.at) Array.prototype.at=function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;return n<0||n>=this.length?undefined:this[n]};
      if (!String.prototype.replaceAll) String.prototype.replaceAll=function(s,r){return this.replace(new RegExp(s,'g'),r)};
      if (typeof window.ResizeObserver==='undefined'){var RO=function(cb){this.cb=cb};RO.prototype.observe=function(t){try{this.cb([{target:t,contentRect:t.getBoundingClientRect()}],this)}catch(e){}};RO.prototype.unobserve=function(){};RO.prototype.disconnect=function(){};window.ResizeObserver=RO}
      if (typeof window.requestIdleCallback!=='function'){window.requestIdleCallback=function(cb,o){return setTimeout(function(){cb({didTimeout:false,timeRemaining:function(){return 50}})},o&&o.timeout?o.timeout:1)};window.cancelIdleCallback=function(id){clearTimeout(id)}}
      // PointerCapture API Polyfill (Safari 13 不支持，Radix UI 等组件依赖)
      if (typeof Element !== 'undefined') {
        if (typeof Element.prototype.setPointerCapture === 'undefined') {
          Element.prototype.setPointerCapture = function(id) { this._capturedPointerId = id; };
        }
        if (typeof Element.prototype.releasePointerCapture === 'undefined') {
          Element.prototype.releasePointerCapture = function(id) { delete this._capturedPointerId; };
        }
        if (typeof Element.prototype.hasPointerCapture === 'undefined') {
          Element.prototype.hasPointerCapture = function(id) { return this._capturedPointerId === id; };
        }
      }
      // Pointer Events bridge (Safari 13 不支持，Radix UI 依赖)
      //
      // 仅提供 PointerEvent 构造器并不能修复交互：系统仍只会派发
      // mousedown/mouseup，而 Radix 会监听 pointerdown/pointerup。这里把真实
      // 鼠标事件转换为等价的 pointer 事件；这样不会影响已经原生支持
      // Pointer Events 的浏览器。
      if (typeof window.PointerEvent==='undefined'){
        (function(){
          function PointerEvent(type, params){
            params=params||{};
            var ev=new MouseEvent(type,params);
            var pointerProperties={
              pointerId:params.pointerId||1,
              width:params.width||1,
              height:params.height||1,
              pressure:params.pressure||0,
              tiltX:params.tiltX||0,
              tiltY:params.tiltY||0,
              pointerType:params.pointerType||'mouse',
              isPrimary:params.isPrimary!==undefined?params.isPrimary:true
            };
            for(var key in pointerProperties){
              try{Object.defineProperty(ev,key,{value:pointerProperties[key]});}catch(e){}
            }
            return ev;
          }
          PointerEvent.prototype=Object.create(MouseEvent.prototype);
          PointerEvent.prototype.constructor=PointerEvent;
          window.PointerEvent=PointerEvent;

          function forwardMouseEvent(mouseEvent, pointerType){
            // 不转发脚本自己派发的事件，避免意外的递归。
            if(mouseEvent.__inflowavePointerBridge) return;
            if(!mouseEvent.target || typeof mouseEvent.target.dispatchEvent !== 'function') return;
            try {
              var pointerEvent=new PointerEvent(pointerType,{
                bubbles:true,
                cancelable:true,
                composed:true,
                view:window,
                detail:mouseEvent.detail,
                screenX:mouseEvent.screenX,
                screenY:mouseEvent.screenY,
                clientX:mouseEvent.clientX,
                clientY:mouseEvent.clientY,
                ctrlKey:mouseEvent.ctrlKey,
                altKey:mouseEvent.altKey,
                shiftKey:mouseEvent.shiftKey,
                metaKey:mouseEvent.metaKey,
                button:mouseEvent.button,
                buttons:mouseEvent.buttons,
                relatedTarget:mouseEvent.relatedTarget,
                pointerId:1,
                pointerType:'mouse',
                isPrimary:true,
                pressure:mouseEvent.buttons ? 0.5 : 0
              });
              try{Object.defineProperty(pointerEvent,'__inflowavePointerBridge',{value:true});}catch(e){}
              mouseEvent.target.dispatchEvent(pointerEvent);
            } catch(e) {}
          }

          var mouseToPointer={
            mousedown:'pointerdown', mouseup:'pointerup', mousemove:'pointermove',
            mouseover:'pointerover', mouseout:'pointerout', mouseenter:'pointerenter', mouseleave:'pointerleave'
          };
          for(var mouseType in mouseToPointer){
            (function(sourceType,targetType){
              document.addEventListener(sourceType,function(event){
                forwardMouseEvent(event,targetType);
              },true);
            })(mouseType,mouseToPointer[mouseType]);
          }
        })();
      }
    </script>
    <!-- Safari 13 detection — adds 'safari13' class to <html> for CSS fallbacks -->
    <script src="/safari13-compat.js"></script>
    <!-- Flexbox gap polyfill — Safari 13 不支持 flex gap，此脚本自动将 gap 转为 margin -->
    <script src="/flex-gap-polyfill.js"></script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfloWave</title>
    <meta
      name="description"
      content="A modern time-series database management tool"
    />

    <!-- Prevent FOUC and improve startup experience -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        /* 使用系统字体作为默认，避免字体加载时的闪烁 */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Inter', system-ui, sans-serif;
        height: 100%;
      }
      
      /* 字体加载完成后的切换 */
      .fonts-loaded html {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #1f2937;
        overflow: hidden;
        height: 100%;
        width: 100%;
        transition: background-color 0.2s ease, color 0.2s ease;
        /* 不固定 body：Catalina WebKit 会把 fixed body 当作独立视口，
           使 React 挂载后的布局和启动遮罩相互覆盖。 */
        position: relative;
      }

      #root {
        height: 100%;
        width: 100%;
        position: relative;
      }

      /* Enhanced loading experience */
      .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
        position: fixed;
        /* `inset` is unsupported by Catalina's Safari 13.  Keep explicit
           offsets here because this element must never become a partial
           invisible click shield during startup. */
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
      }

      .loading-brand {
        margin-bottom: 2rem;
        text-align: center;
      }

      .loading-logo {
        font-size: 2rem;
        font-weight: 600;
        color: #3b82f6;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .loading-tagline {
        font-size: 0.875rem;
        color: #6b7280;
        font-weight: 400;
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e5e7eb;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      .loading-text {
        font-size: 0.875rem;
        color: #6b7280;
        font-weight: 400;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* Dark theme support - automatic detection */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f172a;
          color: #f1f5f9;
        }

        .loading-container {
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .loading-spinner {
          border-color: #374151;
          border-top-color: #60a5fa;
        }

        .loading-logo {
          color: #60a5fa;
        }

        .loading-tagline,
        .loading-text {
          color: #94a3b8;
        }
      }

      /* Manual dark theme class override */
      .dark body {
        background-color: #0f172a !important;
        color: #f1f5f9 !important;
      }

      .dark .loading-container {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
      }

      .dark .loading-spinner {
        border-color: #374151 !important;
        border-top-color: #60a5fa !important;
      }

      .dark .loading-logo {
        color: #60a5fa !important;
      }

      .dark .loading-tagline,
      .dark .loading-text {
        color: #94a3b8 !important;
      }

      /* Fade out animation for smooth transition */
      .loading-container.fade-out {
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      /* Prevent flash of unstyled content */
      #root:empty::before {
        content: '';
        display: block;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Enhanced loading fallback -->
      <div class="loading-container" id="loading-screen">
        <div class="loading-brand">
          <div class="loading-logo">InfloWave</div>
          <div class="loading-tagline" id="loading-tagline">现代化时序数据库管理工具</div>
        </div>
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loading-text">正在初始化...</div>
      </div>
    </div>
    <!-- Portal for glide-data-grid overlay editor -->
    <div id="portal"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Remove loading screen when app is ready -->
    <script>
      // ============================================================================
      // 语言检测和国际化支持
      // ============================================================================

      /**
       * 检测用户语言偏好
       * 优先级：localStorage > 浏览器语言 > 默认语言
       */
      function detectLanguage() {
        try {
          // 1. 从 localStorage 读取保存的语言偏好
          const stored = localStorage.getItem('i18nextLng');
          if (stored) {
            const normalized = normalizeLanguageCode(stored);
            if (normalized === 'zh-CN' || normalized === 'en-US') {
              return normalized;
            }
          }
        } catch (error) {
          console.warn('Failed to read language from localStorage:', error);
        }

        // 2. 检测浏览器语言
        if (navigator.language) {
          const normalized = normalizeLanguageCode(navigator.language);
          if (normalized === 'zh-CN' || normalized === 'en-US') {
            return normalized;
          }
        }

        // 3. 默认使用中文
        return 'zh-CN';
      }

      /**
       * 标准化语言代码
       */
      function normalizeLanguageCode(code) {
        if (!code) return 'zh-CN';
        const lower = code.toLowerCase().trim();

        // 中文变体
        if (lower.startsWith('zh')) return 'zh-CN';
        // 英文变体
        if (lower.startsWith('en')) return 'en-US';

        return 'zh-CN';
      }

      // 检测当前语言
      const currentLanguage = detectLanguage();
      console.log('🌐 Detected language:', currentLanguage);

      // ============================================================================
      // 加载阶段文案（支持多语言）
      // ============================================================================

      const loadingMessages = {
        'zh-CN': {
          tagline: '现代化时序数据库管理工具',
          initializing: '正在初始化...',
          loadingConfig: '加载配置...',
          loadingPreferences: '加载用户偏好...',
          initializingServices: '初始化服务...',
          ready: '准备就绪',
          startupError: '应用程序启动时发生错误，请刷新页面重试',
          initError: '应用程序初始化失败，请检查网络连接并刷新页面',
          timeoutError: '应用程序启动超时，可能存在问题',
          retryButton: '重新加载'
        },
        'en-US': {
          tagline: 'Modern Time-Series Database Management Tool',
          initializing: 'Initializing...',
          loadingConfig: 'Loading configuration...',
          loadingPreferences: 'Loading preferences...',
          initializingServices: 'Initializing services...',
          ready: 'Ready',
          startupError: 'Application startup error, please refresh the page',
          initError: 'Application initialization failed, please check network connection',
          timeoutError: 'Application startup timeout, there may be a problem',
          retryButton: 'Reload'
        }
      };

      // 获取当前语言的文案
      const messages = loadingMessages[currentLanguage] || loadingMessages['zh-CN'];

      // 设置初始文案
      (function setInitialText() {
        const tagline = document.getElementById('loading-tagline');
        const loadingText = document.getElementById('loading-text');

        if (tagline) {
          tagline.textContent = messages.tagline;
        }
        if (loadingText) {
          loadingText.textContent = messages.initializing;
        }
      })();

      /**
       * 更新加载文案
       */
      function updateLoadingText(stage) {
        const loadingText = document.getElementById('loading-text');
        if (loadingText && messages[stage]) {
          loadingText.textContent = messages[stage];
        }
      }

      // ============================================================================
      // 应用启动状态管理
      // ============================================================================

      let hasAppStarted = false;

      // 监听加载阶段事件
      window.addEventListener('app-loading-stage', function(event) {
        if (!hasAppStarted && event.detail && event.detail.stage) {
          updateLoadingText(event.detail.stage);
          console.log('📍 Loading stage:', event.detail.stage);
        }
      });

      // 监听应用就绪事件
      window.addEventListener('app-ready', function() {
        hasAppStarted = true;
        updateLoadingText('ready');

        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          // 先放行输入，再执行淡出。旧版 WKWebView 的 opacity: 0 元素仍会命中测试，
          // 否则动画的 400ms 内所有按钮都会像是“点不动”。
          loadingScreen.style.pointerEvents = 'none';
          // 立即开始淡出动画
          loadingScreen.classList.add('fade-out');
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 400);
        }

        console.log('✅ Application ready');
          });

      // ============================================================================
      // 错误处理
      // ============================================================================

      /**
       * 显示启动错误
       */
      function showStartupError(message) {
        const loadingText = document.getElementById('loading-text');
        if (loadingText && !hasAppStarted) {
          loadingText.textContent = message;
          loadingText.style.color = '#ef4444';
          loadingText.style.whiteSpace = 'pre-wrap';
          loadingText.style.textAlign = 'left';
          loadingText.style.wordBreak = 'break-all';
          loadingText.style.maxWidth = '90vw';
          loadingText.style.maxHeight = '50vh';
          loadingText.style.overflow = 'auto';

          // 停止spinner动画
          const spinner = document.querySelector('.loading-spinner');
          if (spinner) {
            spinner.style.display = 'none';
          }

          // 添加重试按钮
          setTimeout(() => {
            const loadingContainer = document.querySelector('.loading-container');
            if (loadingContainer && !loadingContainer.querySelector('button')) {
              const retryButton = document.createElement('button');
              retryButton.textContent = messages.retryButton;
              retryButton.style.cssText = `
                margin-top: 20px;
                padding: 10px 20px;
                background: #3b82f6;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                transition: background 0.2s;
              `;
              retryButton.onmouseover = () => {
                retryButton.style.background = '#2563eb';
              };
              retryButton.onmouseout = () => {
                retryButton.style.background = '#3b82f6';
              };
              retryButton.onclick = () => window.location.reload();
              loadingContainer.appendChild(retryButton);
            }
          }, 1000);
        }
      }

      // 监听错误事件
      window.addEventListener('error', function(event) {
        console.error('启动错误:', event.error);
        let errorMsg = event.error ? (event.error.name + ': ' + event.error.message) : (event.message || "Unknown Error");
        let stack = event.error && event.error.stack ? '\n' + event.error.stack : '';
        showStartupError(messages.startupError + "\n\nDetails:\n" + errorMsg + stack);
      });

      window.addEventListener('unhandledrejection', function(event) {
        console.error('未处理的Promise拒绝:', event.reason);
        let reasonObj = event.reason || {};
        let errorMsg = reasonObj.message ? (reasonObj.name + ': ' + reasonObj.message) : reasonObj.toString();
        let stack = reasonObj.stack ? '\n' + reasonObj.stack : '';
        showStartupError(messages.initError + "\n\nDetails:\n" + errorMsg + stack);
      });

      // ============================================================================
      // 超时保护机制
      // ============================================================================

      // 如果30秒后还没启动完成，显示错误（给予充足的启动时间，特别是开发环境或低性能设备）
      setTimeout(() => {
        if (!hasAppStarted) {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen && loadingScreen.style.display !== 'none') {
            console.warn('⚠️ 应用启动超过30秒，显示超时错误');
            showStartupError(messages.timeoutError);
          }
        }
      }, 30000); // 30秒超时保护
      
      // 字体加载检测
      if ('fonts' in document) {
        document.fonts.ready.then(function() {
          document.documentElement.classList.add('fonts-loaded');
          console.log('字体加载完成');
        });
      } else {
        // 对于不支持 FontFace API 的浏览器，延迟添加类
        setTimeout(function() {
          document.documentElement.classList.add('fonts-loaded');
        }, 1000);
      }
    </script>
  </body>
</html>
